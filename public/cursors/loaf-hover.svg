<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="crust" x1="30" y1="28" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBE3A6"/>
      <stop offset="0.4" stop-color="#F0BE66"/>
      <stop offset="0.75" stop-color="#DB9C42"/>
      <stop offset="1" stop-color="#B9772C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50" cy="46" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFEDC2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFEDC2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underside" cx="66" cy="98" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#9A5E20" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A5018" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Gold glow behind the loaf: the hover affordance -->
    <radialGradient id="glow" cx="64" cy="66" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0C766" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#C9922E" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#C9922E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M0 0 L0 10" stroke="#A56B25" stroke-opacity="0.12" stroke-width="1.4"/>
    </pattern>
    <clipPath id="loafClip">
      <path d="M16 70 C16 47 38 31 64 31 C90 31 112 47 112 70 C112 89 90 101 64 101 C38 101 16 89 16 70 Z"/>
    </clipPath>
  </defs>

  <!-- Hover affordance: soft gold glow + thin gold ring behind the loaf -->
  <circle cx="64" cy="66" r="60" fill="url(#glow)"/>
  <ellipse cx="64" cy="66" rx="58" ry="48" fill="none" stroke="#C9922E" stroke-width="2.4" opacity="0.85"/>

  <ellipse cx="66" cy="100" rx="46" ry="12" fill="#6B3C14" opacity="0.22"/>

  <path d="M16 70 C16 47 38 31 64 31 C90 31 112 47 112 70 C112 89 90 101 64 101 C38 101 16 89 16 70 Z"
        fill="url(#crust)" stroke="#9A5E20" stroke-width="2"/>

  <g clip-path="url(#loafClip)">
    <rect x="0" y="0" width="128" height="128" fill="url(#hatch)"/>
    <rect x="0" y="0" width="128" height="128" fill="url(#underside)"/>
    <ellipse cx="50" cy="46" rx="44" ry="32" fill="url(#sheen)"/>
    <g stroke-linecap="round" fill="none">
      <path d="M40 55 C52 49 64 48 80 53" stroke="#A8651F" stroke-width="4" opacity="0.8"/>
      <path d="M41 52 C53 46 65 45 80 50" stroke="#FFF1CC" stroke-width="2.2" opacity="0.95"/>
      <path d="M36 67 C50 61 64 60 86 65" stroke="#A8651F" stroke-width="4.4" opacity="0.8"/>
      <path d="M37 64 C51 58 65 57 86 62" stroke="#FFF1CC" stroke-width="2.4" opacity="0.95"/>
      <path d="M40 79 C52 74 66 73 82 78" stroke="#A8651F" stroke-width="4" opacity="0.78"/>
      <path d="M41 76 C53 71 67 70 82 75" stroke="#FFF1CC" stroke-width="2" opacity="0.9"/>
    </g>
    <g fill="#FFF6DC" opacity="0.65">
      <circle cx="30" cy="58" r="1.3"/>
      <circle cx="46" cy="42" r="1.1"/>
      <circle cx="62" cy="40" r="1.4"/>
      <circle cx="82" cy="48" r="1.1"/>
      <circle cx="96" cy="64" r="1.3"/>
      <circle cx="70" cy="88" r="1.1"/>
      <circle cx="52" cy="90" r="1.2"/>
      <circle cx="88" cy="80" r="1.1"/>
    </g>
  </g>
</svg>
